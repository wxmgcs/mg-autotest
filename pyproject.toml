[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mg-autotest"
version = "1.0.1"
description = "基于 OpenCV 模板匹配 + uiautomator2 的 Android UI 自动化测试框架"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "PatrickW"},
]
keywords = ["android", "automation", "opencv", "uiautomator2", "template-matching"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "uiautomator2>=2.16.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "mitmproxy>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/PatrickW/mg-autotest"

[project.scripts]
mg-autotest = "mg_autotest.main:main"
mg-capture-template = "mg_autotest.scripts.capture_template_web:main"
mg-workflow-builder = "mg_autotest.scripts.workflow_builder:main"
mg-workflow-runner = "mg_autotest.scripts.workflow_runner:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mg_autotest*"]
